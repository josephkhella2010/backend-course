<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books</title>
  </head>
  <body>
    <h1>My Books</h1>

    <form>

    <h2>Books</h2>

    <ul class="bookList"></ul>
  </body>
  <script src="script.js"></script>
</html>
