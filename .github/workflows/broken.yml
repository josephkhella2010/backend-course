name: Broken CI

on:
  pull_request:
    branches: ["week12/ci"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm ci
        working-directory: ./week12-ci 

      - run: npm test
        working-directory: ./week12-ci
