# This workflow installs dependencies and runs tests using Node.js

name: CI

on:
  push:
    branches: ["week12/ci"]
  pull_request:
    branches: ["week12/ci"]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: week12-ci/package-lock.json

      - run: npm ci
        working-directory: ./week12-ci

      - run: npm run typecheck
        working-directory: ./week12-ci

      - run: npm run typecheck
        working-directory: ./week12-ci

      - run: npm run build --if-present
        working-directory: ./week12-ci

      - run: npm test
        working-directory: ./week12-ci
