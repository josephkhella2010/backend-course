services:
  postgres:
    image: postgres:16
    container_name: week11-postgres
    restart: always
    env_file:
      - .env
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: week11-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5055:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
